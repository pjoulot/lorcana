services:
  plugin.manager.lorcana_cards.card_data_importer:
    class: Drupal\lorcana_cards\Importer\CardDataImporterManager
    arguments: ['@container.namespaces', '@cache.discovery', '@module_handler']

  plugin.manager.lorcana_cards.card_image_importer:
    class: Drupal\lorcana_cards\Importer\CardImageImporterManager
    arguments: ['@container.namespaces', '@cache.discovery', '@module_handler']

  lorcana_cards.image_converter:
    class: Drupal\lorcana_cards\Service\ImageConverter
    arguments: ['@logger.factory']

  lorcana_cards.upserter:
    class: Drupal\lorcana_cards\Importer\CardUpserter
    arguments: ['@entity_type.manager', '@logger.factory', '@file.repository', '@file_system']

  lorcana_cards.search_syntax:
    class: Drupal\lorcana_cards\Search\CardSearchSyntax
    arguments: ['@entity_type.manager']

  lorcana_cards.search_syntax_redirect:
    class: Drupal\lorcana_cards\EventSubscriber\SearchSyntaxRedirectSubscriber
    arguments: ['@lorcana_cards.search_syntax']
    tags:
      - { name: event_subscriber }
