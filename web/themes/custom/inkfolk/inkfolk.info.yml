name: Inkfolk
type: theme
'base theme': stable9
version: 1.0.0
libraries:
  - inkfolk/global
  - inkfolk/fonts
  - inkfolk/base
  - inkfolk/messages
  - core/normalize
libraries-extend:
  user/drupal.user:
    - inkfolk/user
  core/drupal.dropbutton:
    - inkfolk/dropbutton
  core/drupal.dialog:
    - inkfolk/dialog
  file/drupal.file:
    - inkfolk/file
  core/drupal.item-list:
    - inkfolk/item-list
  core/drupal.progress:
    - inkfolk/progress
  core/drupal.tablesort:
    - inkfolk/drupal.tablesort
description: 'Inkfolk theme for the Lorcana fan site'
core_version_requirement: ^11
generator: 'starterkit_theme:11.3.9'
regions:
  header: 'Header'
  topnav_nav: 'Topnav: navigation'
  primary_menu: 'Primary menu'
  secondary_menu: 'Secondary menu'
  highlighted: 'Highlighted'
  help: 'Help'
  content_top: 'Content: top (inside the main column, above page.content)'
  content: 'Content'
  sidebar_first: 'Sidebar first'
  sidebar_second: 'Sidebar second'
  breadcrumb: 'Breadcrumb'
  footer_menu: 'Footer: menu columns'
  footer: 'Footer'
