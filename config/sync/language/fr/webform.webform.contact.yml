title: Contact
elements: |-
  masthead:
    '#type': webform_markup
    '#markup': '<div class="if-form-head"><div class="if-eyebrow"><span class="if-eyebrow__bar" aria-hidden="true"></span><span class="if-eyebrow__text">Contact</span></div><h1 class="if-form-head__title serif">Get in touch.</h1><p class="if-form-head__lede">We read every message — expect a reply in 1–3 days.</p></div>'
  row:
    '#type': webform_flexbox
    name:
      '#type': textfield
      '#title': 'Your name'
      '#required': true
      '#placeholder': 'Cleo Marquand'
    email:
      '#type': email
      '#title': Email
      '#required': true
      '#placeholder': cleo@example.com
  topic:
    '#type': select
    '#title': "What's this about?"
    '#required': true
    '#empty_option': 'Pick a topic…'
    '#options':
      card_data: 'Card data correction'
      bug: 'Bug report'
      feature: 'Feature suggestion'
      press: 'Press / partnership'
      legal: 'Legal / takedown'
      other: 'Something else'
  message:
    '#type': textarea
    '#title': 'Your message'
    '#required': true
    '#rows': 8
    '#placeholder': "The more specific, the faster we can help. If it's a card bug, please include the set code and card name."
  actions:
    '#type': webform_actions
    '#submit__label': 'Send message →'
settings:
  confirmation_message: 'Votre message a été envoyé.'
handlers:
  email_notification:
    label: 'Notification par courriel'
    settings:
      from_name: '[webform_submission:values:name:raw]'
      subject: '[webform_submission:values:subject:raw]'
      body: '[webform_submission:values:message:value]'
